<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Codex and DSH development bridge</title>
  <desc id="desc">A bridge connecting task dispatch, development, review, and follow-up fixes.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101828"/><stop offset="1" stop-color="#18223b"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#a9a3ff"/><stop offset="1" stop-color="#64d8c2"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
    <text x="64" y="60" fill="#a3b1c7" font-size="13" letter-spacing="3">DEVELOPMENT · CONNECTED</text>
    <text x="64" y="145" fill="#f5f7ff" font-size="64" font-weight="700" letter-spacing="-2">Codex</text>
    <text x="896" y="145" fill="#f5f7ff" font-size="64" font-weight="700" letter-spacing="-2">DSH</text>
    <path d="M325 122H831M816 111l15 11-15 11M340 111l-15 11 15 11" stroke="url(#line)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="514" y="103" width="136" height="38" rx="19" fill="#28314c" stroke="#465273"/>
    <text x="582" y="128" fill="#d9e1f3" font-size="15" text-anchor="middle" letter-spacing="2">BRIDGE</text>
    <text x="67" y="181" fill="#a9a3ff" font-size="17">Plan &amp; review</text>
    <text x="898" y="181" fill="#64d8c2" font-size="17">Build &amp; verify</text>
    <path d="M64 221H1136" stroke="#33405a"/>
    <g font-size="17" fill="#e2e9f7">
      <text x="64" y="265"><tspan fill="#a9a3ff">01</tspan><tspan dx="15">Dispatch</tspan></text>
      <text x="347" y="265"><tspan fill="#64d8c2">02</tspan><tspan dx="15">Develop</tspan></text>
      <text x="630" y="265"><tspan fill="#a9a3ff">03</tspan><tspan dx="15">Review</tspan></text>
      <text x="913" y="265"><tspan fill="#64d8c2">04</tspan><tspan dx="15">Refine</tspan></text>
    </g>
    <text x="64" y="314" fill="#a3b1c7" font-size="14">Workspace sync · Queued messages · Traceable handoffs</text>
    <text x="1136" y="314" fill="#a3b1c7" font-size="12" text-anchor="end">dsh-plugin-codex-bridge</text>
  </g>
</svg>
